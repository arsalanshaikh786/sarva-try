<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Offline – Sarva-Nest</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--primary:#4f46e5;--accent:#7c3aed;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:linear-gradient(145deg,#eef0ff,#f5f0ff);
    font-family:'Nunito',sans-serif;padding:24px;
  }
  .icon{font-size:72px;margin-bottom:16px;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
  h1{font-family:'Syne',sans-serif;font-size:2rem;color:#1e1b4b;margin-bottom:10px;}
  p{color:#6b7280;font-size:15px;max-width:300px;line-height:1.6;margin-bottom:28px;}
  .retry-btn{
    padding:14px 32px;background:linear-gradient(135deg,var(--primary),var(--accent));
    color:#fff;border:none;border-radius:50px;font-family:'Nunito',sans-serif;
    font-size:16px;font-weight:800;cursor:pointer;
    box-shadow:0 8px 20px rgba(79,70,229,.35);
    transition:transform .15s;
  }
  .retry-btn:active{transform:scale(.96);}
  .cached-hint{margin-top:20px;font-size:13px;color:#9ca3af;font-weight:700;}
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You're Offline</h1>
  <p>It looks like you've lost internet connection. Check your network and try again.</p>
  <button class="retry-btn" onclick="location.reload()">🔄 Try Again</button>
  <p class="cached-hint">Previously visited pages may still be available.</p>
</body>
</html>
